<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" aria-label="RZI Crystal Monolith Logo">
  <defs>
    <linearGradient id="logo-g-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ff4500" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="logo-g-violet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="logo-g-magenta" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#d946ef" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="logo-g-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdd00" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#ff6a00" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="logo-g-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#ff8c00" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Shard Group R (Left Wing) -->
  <g class="logo-shard logo-shard-r">
    <polygon points="12,24 24,16 24,52" fill="url(#logo-g-orange)" stroke="#ff7700" stroke-width="1.2" />
    <polygon points="12,24 24,52 12,76" fill="url(#logo-g-violet)" stroke="#c084fc" stroke-width="1.2" />
    <polygon points="12,76 24,52 24,84" fill="url(#logo-g-magenta)" stroke="#d946ef" stroke-width="1.2" />
    <polygon points="24,16 48,20 24,34" fill="url(#logo-g-amber)" stroke="#ffaa00" stroke-width="1.2" />
    <polygon points="48,20 42,40 24,34" fill="url(#logo-g-magenta)" stroke="#f43f5e" stroke-width="1.2" />
    <polygon points="24,34 42,40 24,50" fill="url(#logo-g-violet)" stroke="#9333ea" stroke-width="1.1" />
    <polygon points="24,48 38,42 46,76 34,84" fill="url(#logo-g-orange)" stroke="#ff5500" stroke-width="1.2" />
    <line x1="24" y1="16" x2="24" y2="52" stroke="#ffffff" stroke-width="1.4" />
  </g>

  <!-- Shard Group Z (Central Slash Monolith) -->
  <g class="logo-shard logo-shard-z">
    <polygon points="44,14 50,4 74,14 54,24" fill="url(#logo-g-amber)" stroke="#ffdd00" stroke-width="1.3" />
    <polygon points="74,14 66,38 48,60 54,24" fill="url(#logo-g-magenta)" stroke="#d946ef" stroke-width="1.2" />
    <polygon points="66,38 56,74 42,84 48,60" fill="url(#logo-g-orange)" stroke="#ff5500" stroke-width="1.2" />
    <polygon points="42,84 56,74 74,76 50,96" fill="url(#logo-g-violet)" stroke="#a855f7" stroke-width="1.3" />
    <line x1="74" y1="14" x2="42" y2="84" stroke="#ffdd00" stroke-width="1.3" opacity="0.9" />
    <circle cx="50" cy="4" r="6" fill="url(#logo-g-star)" />
    <circle cx="50" cy="4" r="2" fill="#ffffff" />
    <circle cx="50" cy="96" r="5.5" fill="url(#logo-g-star)" />
    <circle cx="50" cy="96" r="1.8" fill="#ffffff" />
  </g>

  <!-- Shard Group I (Right Vertical Crystal Obelisk) -->
  <g class="logo-shard logo-shard-i">
    <polygon points="82,16 89,23 82,30 75,23" fill="url(#logo-g-amber)" stroke="#ffffff" stroke-width="1.3" />
    <polygon points="76,35 82,31 82,82 76,76" fill="url(#logo-g-violet)" stroke="#c084fc" stroke-width="1.2" />
    <polygon points="82,31 88,37 88,74 82,82" fill="url(#logo-g-orange)" stroke="#ff7700" stroke-width="1.2" />
    <circle cx="82" cy="23" r="5" fill="url(#logo-g-star)" />
    <circle cx="82" cy="23" r="1.8" fill="#ffffff" />
  </g>
</svg>

