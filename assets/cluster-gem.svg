<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" class="cyber-cluster-svg" aria-label="Shattered Geometric Crystal Shards Cluster">
  <defs>
    <!-- Sharp Bloom Laser Filter -->
    <filter id="gem-shard-laser" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="gem-shard-core" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Linear Gradients for Crystalline Fracture Facets -->
    <linearGradient id="g-shard-orange-intense" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#ff4500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="g-shard-violet-radiant" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="g-shard-magenta-flare" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#d946ef" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="g-shard-amber-gold" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffdd00" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ff6a00" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="g-shard-star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#ff8c00" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .crystal-facet {
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      mix-blend-mode: screen;
      cursor: pointer;
    }
    .crystal-facet:hover {
      fill-opacity: 0.98 !important;
      stroke-width: 2.4 !important;
      filter: drop-shadow(0 0 16px rgba(168, 85, 247, 0.85));
    }
  </style>

  <g id="shattered-crystal-formation">
    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- SHARD A: UPPER NEEDLE CRYSTAL (Stabbing Top-Left 45°)          -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="crystal-needle-upper">
      <!-- Facet 1 -->
      <polygon class="crystal-facet" points="160,50 250,135 190,170"
        fill="url(#g-shard-orange-intense)" stroke="#ff7700" stroke-width="1.4" />

      <!-- Facet 2 -->
      <polygon class="crystal-facet" points="160,50 190,170 120,130"
        fill="url(#g-shard-violet-radiant)" stroke="#c084fc" stroke-width="1.3" />

      <!-- Chisel Ridge -->
      <line x1="160" y1="50" x2="190" y2="170" stroke="#ffffff" stroke-width="1.6" filter="url(#gem-shard-laser)" />
    </g>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- SHARD B: LATERAL SPIKE (Projecting Sharp to Far-Right)        -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="crystal-spike-right">
      <!-- Upper Lateral Face -->
      <polygon class="crystal-facet" points="250,135 430,175 320,225"
        fill="url(#g-shard-amber-gold)" stroke="#ffaa00" stroke-width="1.5" />

      <!-- Lower Lateral Face -->
      <polygon class="crystal-facet" points="430,175 355,275 320,225"
        fill="url(#g-shard-magenta-flare)" stroke="#ff4500" stroke-width="1.4" />

      <!-- Back Shadow Face -->
      <polygon class="crystal-facet" points="250,135 320,225 255,230"
        fill="url(#g-shard-violet-radiant)" stroke="#9333ea" stroke-width="1.2" />

      <line x1="430" y1="175" x2="320" y2="225" stroke="#ffdd00" stroke-width="1.5" filter="url(#gem-shard-laser)" />
    </g>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- SHARD C: CENTRAL FRACTURED CORE MONOLITH                       -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="crystal-core-monolith">
      <!-- Central Cleavage Diamond Face -->
      <polygon class="crystal-facet" points="190,170 250,135 255,230 205,245"
        fill="url(#g-shard-magenta-flare)" stroke="#d946ef" stroke-width="1.3" />

      <!-- Deep Prismatic Shard -->
      <polygon class="crystal-facet" points="205,245 255,230 320,225 270,320"
        fill="url(#g-shard-orange-intense)" stroke="#ff5500" stroke-width="1.4" />

      <!-- Left Core Shard -->
      <polygon class="crystal-facet" points="190,170 205,245 155,265"
        fill="url(#g-shard-violet-radiant)" stroke="#8b5cf6" stroke-width="1.2" />

      <!-- Central Ridge Highlight -->
      <line x1="250" y1="135" x2="270" y2="320" stroke="#ffffff" stroke-width="1.4" opacity="0.85" />
    </g>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- SHARD D: LOWER DAGGER CRYSTAL (Stabbing Downward-Left 230°)   -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="crystal-dagger-lower">
      <!-- Dagger Face Left -->
      <polygon class="crystal-facet" points="205,245 155,265 175,440"
        fill="url(#g-shard-violet-radiant)" stroke="#a855f7" stroke-width="1.4" />

      <!-- Dagger Face Right -->
      <polygon class="crystal-facet" points="205,245 270,320 175,440"
        fill="url(#g-shard-orange-intense)" stroke="#ff4500" stroke-width="1.5" />

      <!-- Stepped Cleavage Shard -->
      <polygon class="crystal-facet" points="270,320 355,275 255,385"
        fill="url(#g-shard-magenta-flare)" stroke="#c084fc" stroke-width="1.2" />

      <polygon class="crystal-facet" points="270,320 255,385 175,440"
        fill="url(#g-shard-amber-gold)" stroke="#ff7700" stroke-width="1.2" />

      <line x1="205" y1="245" x2="175" y2="440" stroke="#ffaa00" stroke-width="1.6" filter="url(#gem-shard-laser)" />
    </g>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- DETACHED FLOATING CRYSTAL SPLINTERS (Pecahan Melayang)         -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="floating-splinters">
      <!-- Upper Right Shard -->
      <polygon class="crystal-facet" points="335,55 375,80 345,110"
        fill="url(#g-shard-amber-gold)" stroke="#ffaa00" stroke-width="1.2" />

      <!-- Left Flank Shard -->
      <polygon class="crystal-facet" points="75,220 115,250 85,285"
        fill="url(#g-shard-violet-radiant)" stroke="#c084fc" stroke-width="1.2" />

      <!-- Lower Right Shard -->
      <polygon class="crystal-facet" points="370,340 410,380 360,405"
        fill="url(#g-shard-orange-intense)" stroke="#ff5500" stroke-width="1.2" />
    </g>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- FRACTURE CLEAVAGE LASER TRACES (Retakan Antar Kristal)        -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="fracture-traces" stroke-linecap="round">
      <line x1="160" y1="50" x2="430" y2="175" stroke="#ff8c00" stroke-width="1.1" stroke-dasharray="3 4" opacity="0.8" />
      <line x1="430" y1="175" x2="175" y2="440" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.8" />
      <line x1="160" y1="50" x2="175" y2="440" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 5" opacity="0.65" />
      <line x1="335" y1="55" x2="250" y2="135" stroke="#ffaa00" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.75" />
      <line x1="75" y1="220" x2="155" y2="265" stroke="#c084fc" stroke-width="0.9" stroke-dasharray="2 3" opacity="0.75" />
    </g>

    <!-- ══════════════════════════════════════════════════════════════ -->
    <!-- SHARD APEX VERTICES (Point Stars Hanya di Ujung Tajam)        -->
    <!-- ══════════════════════════════════════════════════════════════ -->
    <g class="shard-star-vertices">
      <!-- Tip Shard A (Top Needle) -->
      <g transform="translate(160, 50)">
        <circle r="14" fill="url(#g-shard-star)" filter="url(#gem-shard-core)" />
        <circle r="3.5" fill="#ffffff" />
        <circle r="7" fill="none" stroke="#ff7700" stroke-width="1.2" />
      </g>

      <!-- Tip Shard B (Far-Right Spike) -->
      <g transform="translate(430, 175)">
        <circle r="15" fill="url(#g-shard-star)" filter="url(#gem-shard-core)" />
        <circle r="4" fill="#ffffff" />
        <circle r="8" fill="none" stroke="#ff4500" stroke-width="1.3" />
      </g>

      <!-- Tip Shard D (Lower Dagger) -->
      <g transform="translate(175, 440)">
        <circle r="15" fill="url(#g-shard-star)" filter="url(#gem-shard-core)" />
        <circle r="4" fill="#ffffff" />
        <circle r="8" fill="none" stroke="#a855f7" stroke-width="1.3" />
      </g>

      <!-- Central Cleavage Junction -->
      <g transform="translate(250, 135)">
        <circle r="12" fill="url(#g-shard-star)" />
        <circle r="3" fill="#ffffff" />
      </g>

      <g transform="translate(320, 225)">
        <circle r="12" fill="url(#g-shard-star)" />
        <circle r="3" fill="#ffffff" />
      </g>

      <g transform="translate(205, 245)">
        <circle r="16" fill="url(#g-shard-star)" filter="url(#gem-shard-core)" />
        <circle r="4" fill="#ffffff" />
        <circle r="8" fill="none" stroke="#ffffff" stroke-width="1.4" />
      </g>

      <g transform="translate(270, 320)">
        <circle r="11" fill="url(#g-shard-star)" />
        <circle r="3" fill="#ffffff" />
      </g>
    </g>
  </g>
</svg>
