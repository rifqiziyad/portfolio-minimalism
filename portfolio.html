<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALL PROJECTS — RIFQI ZIYAD IMTINAN</title>
  <meta name="description"
    content="Complete archive of engineering projects, banking backoffice systems, and customer platforms by Rifqi Ziyad Imtinan.">
  <meta name="keywords"
    content="Rifqi Ziyad Imtinan, Portfolio, Frontend Developer, React.js, TypeScript, FinTech, Projects, Archive">

  <!-- Favicon icon (RZI Crystal Shard Monolith) -->
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">

  <!-- Google Fonts: Syne (Headline) + Inter (Body) + Space Grotesk (Labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&family=Syne:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Glowing Orange Cursor Blob -->
  <div id="cursor-blob" aria-hidden="true"></div>
  <div id="cursor-glow" aria-hidden="true"></div>
  <div id="cursor-dot" aria-hidden="true"></div>

  <!-- Noise Overlay for Rich Brutalist Texture -->
  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Top Navigation Bar -->
  <header class="site-header" id="header">
    <div class="nav-container">
      <a href="index.html#hero" class="nav-brand" aria-label="Home">
        <img src="assets/logo.svg" alt="RZI Logo" class="brand-logo-svg" width="32" height="32">
        <span class="brand-name">RIFQI</span>
      </a>

      <div class="nav-right">
        <nav class="nav-menu" id="navMenu">
          <ul class="nav-list">
            <li class="nav-item"><a href="portfolio.html" class="nav-link is-current">PORTFOLIO</a></li>
            <li class="nav-item"><a href="index.html#timeline" class="nav-link">TIMELINE</a></li>
            <li class="nav-item"><a href="index.html#skills" class="nav-link">SKILLS</a></li>
            <li class="nav-item"><a href="index.html#education" class="nav-link">EDUCATION</a></li>
            <li class="nav-item"><a href="index.html#contact" class="nav-link">CONTACT</a></li>
          </ul>
        </nav>

        <a href="index.html#portfolio" class="nav-back-link" aria-label="Back to Home">
          <span class="back-arrow">←</span>
          <span>BACK TO HOME</span>
        </a>

        <!-- Hamburger Icon for Mobile Drawer -->
        <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation menu">
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Wrapper -->
  <main id="mainContent">

    <!-- ═══════════════════════════════════════ -->
    <!-- ALL PORTFOLIO ARCHIVE SECTION           -->
    <!-- ═══════════════════════════════════════ -->
    <section class="section section-portfolio section-portfolio-page" id="portfolio">
      <div class="bg-outline-text bg-text-portfolio" data-parallax="0.2" aria-hidden="true">PORTFOLIO</div>

      <div class="container portfolio-container">
        <div class="section-header reveal reveal-fade">
          <div class="section-title-wrap">
            <h1 class="section-main-title">ALL PROJECTS</h1>
          </div>
          <span class="portfolio-count-badge" id="portfolioTotalBadge">ARCHIVE</span>
        </div>

        <!-- Dynamic Full Portfolio List rendered from data/portfolio-data.js (All items) -->
        <div class="portfolio-list" id="portfolioList"></div>
      </div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════ -->
  <!-- SITE FOOTER                             -->
  <!-- ═══════════════════════════════════════ -->
  <footer class="site-footer">
    <div class="container footer-container">
      <div class="footer-left">
        <span class="footer-brand">RIFQI ZIYAD IMTINAN</span>
      </div>
      <div class="footer-center">
        <span class="footer-copy">© 2026 ALL RIGHTS RESERVED.</span>
      </div>
      <div class="footer-right">
        <a href="#portfolio" class="back-to-top" id="backToTop">
          <span>BACK TO TOP</span>
          <span class="arrow">↑</span>
        </a>
      </div>
    </div>
  </footer>

  <!-- The Monolith Shard Lightbox (Portfolio Gallery Carousel) -->
  <div class="carousel-modal" id="portfolioCarouselModal" role="dialog" aria-modal="true" aria-label="Portfolio Gallery">
    <div class="carousel-backdrop" id="carouselBackdrop" aria-hidden="true"></div>
    <div class="carousel-scanline" aria-hidden="true"></div>

    <!-- Header Bar -->
    <div class="carousel-header">
      <div class="carousel-project-info">
        <h3 class="carousel-project-title" id="carouselProjectTitle">PROJECT</h3>
        <span class="carousel-project-tag" id="carouselProjectTag">CATEGORY</span>
      </div>

      <div class="carousel-center-meta">
        <span class="carousel-counter" id="carouselCounter">
          <span class="carousel-counter-active" id="carouselCurrentIndex">01</span> / <span id="carouselTotalCount">04</span>
        </span>
      </div>

      <button class="carousel-close-btn" id="carouselCloseBtn" aria-label="Close Gallery">
        <span>✕</span>
      </button>
    </div>

    <!-- Main Stage -->
    <div class="carousel-stage" id="carouselStage">
      <button class="carousel-nav-btn carousel-btn-prev" id="carouselPrevBtn" aria-label="Previous Slide">
        <span>←</span>
      </button>

      <div class="carousel-slide-viewport" id="carouselViewport">
        <div class="carousel-slide-card" id="carouselSlideCard">
          <img src="" alt="Portfolio Showcase" class="carousel-main-img" id="carouselMainImg">
        </div>
      </div>

      <button class="carousel-nav-btn carousel-btn-next" id="carouselNextBtn" aria-label="Next Slide">
        <span>→</span>
      </button>
    </div>

    <!-- Footer with interactive thumbnails -->
    <div class="carousel-footer">
      <div class="carousel-thumbs-track" id="carouselThumbsTrack" role="tablist" aria-label="Gallery Thumbnails"></div>
    </div>
  </div>

  <!-- GSAP Core & ScrollTrigger Plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

  <!-- Portfolio Data (JSON-structured data module) -->
  <script src="data/portfolio-data.js"></script>

  <!-- Modular Application Scripts (Layered Architecture — works on both file:// and HTTP) -->
  <script defer src="js/core/scroll.js"></script>
  <script defer src="js/renderers/portfolio.js"></script>
  <script defer src="js/core/renderer.js"></script>
  <script defer src="js/components/cursor.js"></script>
  <script defer src="js/components/navigation.js"></script>
  <script defer src="js/components/carousel.js"></script>
  <script defer src="js/animations/parallax.js"></script>
  <script defer src="js/main.js"></script>

  <!-- Dynamic Badge Count Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const totalBadge = document.getElementById('portfolioTotalBadge');
      if (totalBadge && window.PortfolioData) {
        const count = (window.PortfolioData.portfolio || window.PortfolioData.works || []).length;
        totalBadge.textContent = `${count < 10 ? '0' + count : count} WORKS`;
      }
    });
  </script>
</body>

</html>
